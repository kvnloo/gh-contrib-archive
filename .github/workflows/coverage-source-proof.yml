name: Coverage source proof
on:
  push:
    branches: [fix/active-repo-coverage-20261004]
permissions:
  contents: read
concurrency:
  group: coverage-source-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package tracked public source only
        run: git archive --format=tar --output=/tmp/archive-source.tar HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-source-${{ github.sha }}
          path: /tmp/archive-source.tar
          retention-days: 1
