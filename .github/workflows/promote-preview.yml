name: Promote preview to nightly

on:
  push:
    branches: [preview]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: promote-preview-to-nightly
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge preview into nightly when scheme allows
        id: promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! python3 scripts/rollout.py allow-promote preview-to-nightly; then
            echo "scheme forbids preview→nightly promote"
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin preview nightly
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B nightly origin/nightly
          before=$(git rev-parse HEAD)
          git merge --no-ff origin/preview -m "Promote preview into nightly"
          after=$(git rev-parse HEAD)
          if [ "$before" = "$after" ]; then
            echo "nightly already contains preview"
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin HEAD:nightly
          echo "promoted=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: promote
    if: needs.promote.outputs.promoted == 'true'
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: nightly
    secrets: inherit
