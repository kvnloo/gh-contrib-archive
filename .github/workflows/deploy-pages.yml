name: Deploy GitHub Pages

on:
  push:
    branches: [nightly]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build and deploy
        required: false
        type: string
        default: nightly

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      NEXT_PUBLIC_BASE_PATH: /gh-contrib-archive
    steps:
      - name: Check out release code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind canonical public archive snapshot
        run: |
          set -euo pipefail
          git fetch https://github.com/kvnloo/gh-contrib-archive.git main --depth=1
          git show FETCH_HEAD:data/public.db > data/public.db
          echo "PUBLIC_ARCHIVE_COMMIT=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Restore bounded covered-inbox cache
        uses: actions/cache@v4
        with:
          path: .cache/covered-attention.json
          key: covered-attention-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            covered-attention-v1-${{ runner.os }}-

      - run: npm ci

      - name: Refresh complete public work inventory
        env:
          GITHUB_TOKEN: ${{ secrets.GH_INBOX_TOKEN || github.token }}
          PUBLIC_READ_REQUEST_LIMIT: "220"
          PUBLIC_ATTENTION_DEEP_LIMIT: "48"
        run: npm run inbox:public-sync

      - name: Persist verified covered-inbox progress
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/covered-attention.json
          key: covered-attention-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - id: unit
        run: npm test

      - id: build
        run: npm run build

      - name: Verify covered inbox before publication
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const root = "out/api/v1";
          const read = (name) => JSON.parse(fs.readFileSync(`${root}/${name}`, "utf8"));
          const index = read("index.json");
          const attention = read("attention.json");
          const repos = read("repos.json");
          const archiveManifest = JSON.parse(fs.readFileSync("out/data/manifest.json", "utf8"));
          if (index.coverage?.source !== "covered-public-inventory") throw new Error("covered collector not authoritative");
          if (index.coverage?.inventoryComplete !== true) throw new Error("inventory is incomplete; refusing publication");
          if (attention.coverage?.inventoryComplete !== true) throw new Error("attention coverage is incomplete");
          if (repos.count !== archiveManifest.counts?.repos) {
            throw new Error(`repo materialization mismatch: api=${repos.count} archive=${archiveManifest.counts?.repos}`);
          }
          for (const row of repos.repos ?? []) {
            if (typeof row.href !== "string" || !fs.existsSync(`${root}/${row.href}`)) {
              throw new Error(`missing materialized repo context: ${row.repo ?? "unknown"}`);
            }
          }
          const gev = `${root}/repos/bilawalsidhu/gods-eye-view.json`;
          if (!fs.existsSync(gev)) throw new Error("GEV is missing from covered repository materialization");
          const repo = JSON.parse(fs.readFileSync(gev, "utf8"));
          if (!Array.isArray(repo.attention) || repo.attention.length < 1) throw new Error("GEV inbox has no current work rows");
          const largest = [];
          for (const file of ["index.json", "attention.json", "repos.json", "recent.json", "queues.json"]) {
            largest.push([file, fs.statSync(`${root}/${file}`).size]);
          }
          console.log(JSON.stringify({
            dataCommit: process.env.PUBLIC_ARCHIVE_COMMIT,
            coveredRepos: index.coverage.activeRepos?.length ?? null,
            materializedRepos: repos.count,
            archiveRepos: archiveManifest.counts?.repos ?? null,
            attentionRows: attention.count,
            gevRows: repo.attention.length,
            coreBytes: Object.fromEntries(largest),
          }));
          NODE

      - id: dogfood
        run: npm run dogfood:api

      - name: Evaluate API and record aggregate metrics
        if: always()
        env:
          EVAL_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVAL_TEST_OUTCOME: ${{ steps.unit.outcome }}
          EVAL_BUILD_OUTCOME: ${{ steps.build.outcome }}
          EVAL_DOGFOOD_OUTCOME: ${{ steps.dogfood.outcome }}
        run: npm run eval:api -- --require-export

      - name: Retain API evaluation history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-evals-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/api-evals/report.json
            .cache/api-evals/summary.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static export
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: archive-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed covered inbox
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base = os.environ["PAGE_URL"].rstrip("/")
          error = None
          for _ in range(12):
              try:
                  with urllib.request.urlopen(base + "/api/v1/index.json", timeout=10) as r:
                      index = json.load(r)
                  with urllib.request.urlopen(base + "/api/v1/repos.json", timeout=10) as r:
                      repos = json.load(r)
                  with urllib.request.urlopen(base + "/data/manifest.json", timeout=10) as r:
                      manifest = json.load(r)
                  with urllib.request.urlopen(base + "/api/v1/repos/bilawalsidhu/gods-eye-view.json", timeout=10) as r:
                      gev = json.load(r)
                  if index.get("coverage", {}).get("source") != "covered-public-inventory":
                      raise RuntimeError("deployed index is not the covered collector")
                  if index.get("coverage", {}).get("inventoryComplete") is not True:
                      raise RuntimeError("deployed inventory is incomplete")
                  if repos.get("count") != manifest.get("counts", {}).get("repos"):
                      raise RuntimeError("deployed repo materialization does not cover the archive")
                  if not gev.get("attention"):
                      raise RuntimeError("deployed GEV inbox is empty")
                  print(json.dumps({"revision": index.get("revision"), "materializedRepos": repos.get("count"), "gevRows": len(gev["attention"])}))
                  break
              except Exception as exc:
                  error = exc
                  time.sleep(10)
          else:
              raise SystemExit(f"deployed verification failed: {error}")
          PY
