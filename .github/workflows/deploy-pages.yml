name: Deploy GitHub Pages

on:
  push:
    branches: [nightly]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build and deploy
        required: false
        type: string
        default: nightly

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      NEXT_PUBLIC_BASE_PATH: /gh-contrib-archive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Restore public attention classifier cache
        uses: actions/cache@v4
        with:
          path: .cache/public-attention.json
          key: public-attention-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            public-attention-${{ runner.os }}-
      - run: npm ci
      - name: Refresh public authored-PR attention hotset
        run: npm run inbox:public-sync
      - name: Enrich attention cache from GitHub notifications when configured
        env:
          GH_TOKEN: ${{ secrets.GH_INBOX_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            npm run inbox:sync
          else
            echo "GH_INBOX_TOKEN is optional; public attention data was refreshed without credentials."
          fi
      - id: unit
        run: npm test
      - id: build
        run: npm run build
      - id: dogfood
        run: npm run dogfood:api
      - name: Evaluate API and record aggregate metrics
        if: always()
        env:
          EVAL_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVAL_TEST_OUTCOME: ${{ steps.unit.outcome }}
          EVAL_BUILD_OUTCOME: ${{ steps.build.outcome }}
          EVAL_DOGFOOD_OUTCOME: ${{ steps.dogfood.outcome }}
        run: npm run eval:api -- --require-export
      - name: Retain API evaluation history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-evals-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/api-evals/report.json
            .cache/api-evals/summary.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static export
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: archive-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
