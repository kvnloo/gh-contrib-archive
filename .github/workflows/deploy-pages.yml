name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    env:
      NEXT_PUBLIC_BASE_PATH: /gh-contrib-archive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Restore bounded covered-inbox cache
        uses: actions/cache@v4
        with:
          path: .cache/covered-attention.json
          key: covered-attention-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            covered-attention-v1-${{ runner.os }}-
      - run: npm ci
      - name: Refresh complete public work inventory
        env:
          GITHUB_TOKEN: ${{ secrets.GH_INBOX_TOKEN || github.token }}
          PUBLIC_READ_REQUEST_LIMIT: "220"
          PUBLIC_ATTENTION_DEEP_LIMIT: "48"
        run: npm run inbox:public-sync
      - id: unit
        run: npm test
      - name: Record this public release
        run: |
          node -e "require('node:fs').writeFileSync('public/release.json', JSON.stringify({revision:process.env.GITHUB_SHA,builtAt:new Date().toISOString(),source:'public snapshot only'}))"
      - id: build
        run: npm run build
      - name: Verify covered inbox before publication
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const root = "out/api/v1";
          const read = (name) => JSON.parse(fs.readFileSync(`${root}/${name}`, "utf8"));
          const index = read("index.json");
          const attention = read("attention.json");
          if (index.coverage?.source !== "covered-public-inventory") throw new Error("covered collector not authoritative");
          if (index.coverage?.inventoryComplete !== true) throw new Error("inventory is incomplete; refusing publication");
          if (attention.coverage?.inventoryComplete !== true) throw new Error("attention coverage is incomplete");
          const gev = `${root}/repos/bilawalsidhu/gods-eye-view.json`;
          if (!fs.existsSync(gev)) throw new Error("GEV is missing from covered repository materialization");
          const repo = JSON.parse(fs.readFileSync(gev, "utf8"));
          if (!Array.isArray(repo.attention) || repo.attention.length < 1) throw new Error("GEV inbox has no current work rows");
          console.log(JSON.stringify({
            coveredRepos: index.coverage.activeRepos?.length ?? null,
            attentionRows: attention.count,
            gevRows: repo.attention.length,
          }));
          NODE
      - id: dogfood
        run: npm run dogfood:api
      - name: Evaluate API and record aggregate metrics
        if: always()
        env:
          EVAL_HEAD_SHA: ${{ github.sha }}
          EVAL_TEST_OUTCOME: ${{ steps.unit.outcome }}
          EVAL_BUILD_OUTCOME: ${{ steps.build.outcome }}
          EVAL_DOGFOOD_OUTCOME: ${{ steps.dogfood.outcome }}
        run: npm run eval:api -- --require-export
      - name: Retain API evaluation history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-evals-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/api-evals/report.json
            .cache/api-evals/summary.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Publish connector-readable API snapshot
        env:
          READ_CACHE_BRANCH: read-cache
          READ_CACHE_SOURCE_SHA: ${{ github.sha }}
        run: bash scripts/publish-read-cache.sh
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static export
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed covered inbox
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base = os.environ["PAGE_URL"].rstrip("/")
          error = None
          for _ in range(12):
              try:
                  with urllib.request.urlopen(base + "/api/v1/index.json", timeout=10) as r:
                      index = json.load(r)
                  with urllib.request.urlopen(base + "/api/v1/repos/bilawalsidhu/gods-eye-view.json", timeout=10) as r:
                      gev = json.load(r)
                  if index.get("coverage", {}).get("source") != "covered-public-inventory":
                      raise RuntimeError("deployed index is not the covered collector")
                  if index.get("coverage", {}).get("inventoryComplete") is not True:
                      raise RuntimeError("deployed inventory is incomplete")
                  if not gev.get("attention"):
                      raise RuntimeError("deployed GEV inbox is empty")
                  print(json.dumps({"revision": index.get("revision"), "gevRows": len(gev["attention"])}))
                  break
              except Exception as exc:
                  error = exc
                  time.sleep(10)
          else:
              raise SystemExit(f"deployed verification failed: {error}")
          PY
