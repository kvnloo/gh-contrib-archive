name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    env:
      NEXT_PUBLIC_BASE_PATH: /gh-contrib-archive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Restore bounded covered-inbox cache
        uses: actions/cache@v4
        with:
          path: .cache/covered-attention.json
          key: covered-attention-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            covered-attention-v1-${{ runner.os }}-
      - run: npm ci
      - name: Refresh complete public work inventory
        env:
          GITHUB_TOKEN: ${{ secrets.GH_INBOX_TOKEN || github.token }}
          PUBLIC_READ_REQUEST_LIMIT: "220"
          PUBLIC_ATTENTION_DEEP_LIMIT: "48"
        run: npm run inbox:public-sync
      - id: unit
        run: npm test
      - name: Record this public release
        run: |
          node -e "require('node:fs').writeFileSync('public/release.json', JSON.stringify({revision:process.env.GITHUB_SHA,builtAt:new Date().toISOString(),source:'public snapshot only'}))"
      - id: build
        run: npm run build
      - name: Verify covered inbox before publication
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const root = "out/api/v1";
          const read = (name) => JSON.parse(fs.readFileSync(`${root}/${name}`, "utf8"));
          const index = read("index.json");
          const attention = read("attention.json");
          if (index.coverage?.source !== "covered-public-inventory") throw new Error("covered collector not authoritative");
          if (index.coverage?.inventoryComplete !== true) throw new Error("inventory is incomplete; refusing publication");
          if (attention.coverage?.inventoryComplete !== true) throw new Error("attention coverage is incomplete");
          if (!Array.isArray(attention.items) || attention.count !== attention.items.length) throw new Error("attention count mismatch");
          const repos = Array.isArray(index.coverage?.activeRepos) ? index.coverage.activeRepos : [];
          if (new Set(repos).size !== repos.length) throw new Error("duplicate active repository");
          for (const repo of repos) {
            const parts = repo.split("/");
            if (parts.length !== 2 || parts.some((part) => !/^[A-Za-z0-9_.-]+$/.test(part))) throw new Error("unsafe active repository");
            const file = `${root}/repos/${parts[0]}/${parts[1]}.json`;
            if (!fs.existsSync(file)) throw new Error(`missing repository materialization for ${repo}`);
            const resource = JSON.parse(fs.readFileSync(file, "utf8"));
            if (resource.repo !== repo || resource.privacy !== "public-safe") throw new Error(`invalid repository materialization for ${repo}`);
          }
          console.log(JSON.stringify({
            activeRepos: repos.length,
            attentionRows: attention.count,
            feedbackComplete: index.coverage?.feedbackComplete ?? null,
          }));
          NODE
      - id: dogfood
        run: npm run dogfood:api
      - name: Evaluate API and record aggregate metrics
        if: always()
        env:
          EVAL_HEAD_SHA: ${{ github.sha }}
          EVAL_TEST_OUTCOME: ${{ steps.unit.outcome }}
          EVAL_BUILD_OUTCOME: ${{ steps.build.outcome }}
          EVAL_DOGFOOD_OUTCOME: ${{ steps.dogfood.outcome }}
        run: npm run eval:api -- --require-export
      - name: Retain API evaluation history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-evals-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/api-evals/report.json
            .cache/api-evals/summary.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Publish connector-readable API snapshot
        env:
          READ_CACHE_BRANCH: read-cache
          READ_CACHE_SOURCE_SHA: ${{ github.sha }}
        run: bash scripts/publish-read-cache.sh
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static export
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed covered inbox
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          base = os.environ["PAGE_URL"].rstrip("/")
          error = None
          for _ in range(12):
              try:
                  with urllib.request.urlopen(base + "/api/v1/index.json", timeout=10) as r:
                      index = json.load(r)
                  with urllib.request.urlopen(base + "/api/v1/attention.json", timeout=10) as r:
                      attention = json.load(r)
                  if index.get("coverage", {}).get("source") != "covered-public-inventory":
                      raise RuntimeError("deployed index is not the covered collector")
                  if index.get("coverage", {}).get("inventoryComplete") is not True:
                      raise RuntimeError("deployed inventory is incomplete")
                  if attention.get("coverage", {}).get("inventoryComplete") is not True:
                      raise RuntimeError("deployed attention coverage is incomplete")
                  if attention.get("count") != len(attention.get("items", [])):
                      raise RuntimeError("deployed attention count mismatch")
                  repos = index.get("coverage", {}).get("activeRepos") or []
                  if repos:
                      owner, name = repos[0].split("/", 1)
                      path = "/api/v1/repos/" + urllib.parse.quote(owner, safe="") + "/" + urllib.parse.quote(name, safe="") + ".json"
                      with urllib.request.urlopen(base + path, timeout=10) as r:
                          resource = json.load(r)
                      if resource.get("repo") != repos[0] or resource.get("privacy") != "public-safe":
                          raise RuntimeError("deployed repository materialization mismatch")
                  print(json.dumps({
                      "revision": index.get("revision"),
                      "activeRepos": len(repos),
                      "attentionRows": attention.get("count"),
                  }))
                  break
              except Exception as exc:
                  error = exc
                  time.sleep(10)
          else:
              raise SystemExit(f"deployed verification failed: {error}")
          PY
