name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# The default branch owns scheduling, but the release implementation lives on
# nightly. This keeps one publisher while still rebuilding whenever main's
# canonical public.db advances.
jobs:
  deploy-nightly:
    uses: kvnloo/gh-contrib-archive/.github/workflows/deploy-pages.yml@nightly
    with:
      ref: nightly
    secrets: inherit
