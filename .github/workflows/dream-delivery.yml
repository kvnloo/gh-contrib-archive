name: Dream delivery
on:
  push:
    branches: [codex/enchant-mycelium]
  workflow_dispatch:
concurrency:
  group: dream-delivery
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_BASE_PATH: /gh-contrib-archive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Read allowed deployment refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/environments/github-pages/deployment-branch-policies" --jq '.branch_policies[] | {name,type}' || true
      - run: npm ci
      - run: npm test
      - run: npm run build
