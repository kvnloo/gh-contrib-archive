name: Automerge preview

on:
  pull_request:
    branches: [preview]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  automerge:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - name: Merge into preview when scheme allows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if python3 scripts/rollout.py allow-automerge preview; then
            gh pr merge "$PR" --merge --delete-branch=false
          else
            echo "scheme forbids preview automerge"
          fi

  promote:
    needs: automerge
    if: needs.automerge.result == 'success'
    uses: ./.github/workflows/promote-preview.yml
    secrets: inherit
