name: Stats visual smoke (feature branch only)

on:
  push:
    branches:
      - feat/dev-velocity-stats-93
    paths:
      - .github/workflows/stats-visual-smoke.yml

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_BASE_PATH: /gh-contrib-archive
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Serve built GitHub Pages export
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .smoke/gh-contrib-archive
          cp -a out/. .smoke/gh-contrib-archive/
          python3 -m http.server 43147 --bind 127.0.0.1 --directory .smoke > /tmp/stats-http.log 2>&1 &
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:43147/gh-contrib-archive/stats/ > /tmp/stats-export.html && break
            sleep 1
          done
          grep -q 'Commit history' /tmp/stats-export.html
      - name: Screenshot desktop and mobile with headless Chrome
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p stats-screens
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$BROWSER"
          timeout 50 "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --force-device-scale-factor=1 --window-size=1440,960 \
            --screenshot=stats-screens/desktop.png \
            "http://127.0.0.1:43147/gh-contrib-archive/stats/" >/tmp/chrome-desktop.log 2>&1
          timeout 50 "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --force-device-scale-factor=1 --window-size=390,844 \
            --screenshot=stats-screens/mobile.png \
            "http://127.0.0.1:43147/gh-contrib-archive/stats/" >/tmp/chrome-mobile.log 2>&1
          file stats-screens/*.png
          test "$(stat -c %s stats-screens/desktop.png)" -gt 5000
          test "$(stat -c %s stats-screens/mobile.png)" -gt 5000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stats-visual-smoke
          path: |
            stats-screens/
            /tmp/chrome-desktop.log
            /tmp/chrome-mobile.log
          retention-days: 7
